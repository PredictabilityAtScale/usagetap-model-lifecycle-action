name: Test action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test

  live-action-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit fixture models with the local action
        id: audit
        uses: ./
        with:
          paths: examples
          models: openai/gpt-4-turbo
          minimum-models: 1
          fail-on: never
          unknown-policy: ignore
          api-error-policy: error
      - name: Verify source-backed transition evidence
        shell: bash
        env:
          RESULTS_JSON: ${{ steps.audit.outputs.results-json }}
        run: |
          node -e 'const rows=JSON.parse(process.env.RESULTS_JSON); const row=rows.find((item)=>item.modelKey==="openai/gpt-4-turbo"); if (!row?.lifecycleSourceUrl || !row?.lifecycleCheckedAt) { throw new Error("Expected the known transition to include a provider source URL and checked date"); }'
