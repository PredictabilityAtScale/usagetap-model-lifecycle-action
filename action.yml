name: UsageTap Model Lifecycle Check
description: Find AI model keys in a repository and fail CI when UsageTap recommends replacement.
author: UsageTap

branding:
  icon: alert-triangle
  color: purple

inputs:
  paths:
    description: Comma or newline separated files/directories to scan, relative to the repository root.
    required: false
    default: .
  exclude:
    description: Additional comma or newline separated path globs to skip.
    required: false
    default: ""
  models:
    description: Explicit provider-qualified model keys to check in addition to discovered keys and models.include.
    required: false
    default: ""
  include-file:
    description: Optional repository-relative file containing provider-qualified model keys that discovery cannot see.
    required: false
    default: models.include
  ignore-file:
    description: Optional repository-relative file containing expiring, reasoned lifecycle waivers.
    required: false
    default: models.ignore
  fail-on:
    description: Comma separated actions that fail the check. Supported values are replace, review, both, and never.
    required: false
    default: replace
  unknown-policy:
    description: "How to handle UNKNOWN keys: warn, error, or ignore."
    required: false
    default: warn
  api-error-policy:
    description: "How to handle network, API, or degraded responses: error or warn."
    required: false
    default: error
  max-file-bytes:
    description: Maximum size of any scanned file.
    required: false
    default: "1048576"
  max-models:
    description: Maximum number of unique model keys sent to the API.
    required: false
    default: "100"
  minimum-models:
    description: Minimum number of unique model keys required. Zero disables the minimum but not the zero-model warning.
    required: false
    default: "0"
  issue-policy:
    description: "Optional migration issue policy: off, replace, or review-and-replace."
    required: false
    default: off
  github-token:
    description: GitHub token with issues write permission, required only when issue-policy is enabled.
    required: false
    default: ""
  issue-label:
    description: Label applied to migration issues when the label exists.
    required: false
    default: model-lifecycle
  issue-assignees:
    description: Optional comma or newline separated GitHub usernames assigned to migration issues.
    required: false
    default: ""
  api-base-url:
    description: UsageTap API base URL.
    required: false
    default: https://api.usagetap.com

outputs:
  models-found:
    description: Number of unique model keys checked.
  replace-count:
    description: Number of keys with action REPLACE.
  review-count:
    description: Number of keys with action REVIEW.
  keep-count:
    description: Number of keys with action KEEP.
  unknown-count:
    description: Number of keys with lifecycle status UNKNOWN.
  degraded-count:
    description: Number of degraded API decisions.
  error-count:
    description: Number of model lookups that failed.
  waived-count:
    description: Number of audited models with a matching lifecycle waiver.
  unused-waiver-count:
    description: Number of waiver entries that did not match an audited model.
  files-scanned:
    description: Number of repository files scanned.
  files-skipped:
    description: Number of non-scannable, binary, or oversized files skipped.
  results-json:
    description: Compact JSON array of lifecycle decisions.

runs:
  using: node24
  main: dist/index.js
