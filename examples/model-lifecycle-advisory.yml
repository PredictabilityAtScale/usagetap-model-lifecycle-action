name: Model lifecycle (advisory)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check model lifecycle without blocking
        uses: PredictabilityAtScale/usagetap-model-lifecycle-action@v1
        with:
          paths: .
          fail-on: never
          unknown-policy: warn
          # fail-on controls lifecycle decisions only; this makes API/degraded failures advisory too.
          api-error-policy: warn
